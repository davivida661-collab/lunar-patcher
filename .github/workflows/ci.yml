name: build/release

on:
  push:
    branches: [ "master" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - run: gh release create ${{ github.ref_name }} -R ${{ github.repository }} --draft --title ${GITHUB_REF_NAME#v} -n ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    if: always() && !failure() && !cancelled()

    strategy:
      # Keep other OS builds running when one fails instead of canceling them
      # mid-flight ("The operation was canceled.")
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: dtolnay/rust-toolchain@nightly

    - uses: mozilla-actions/sccache-action@v0.0.11

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build with Gradle
      # bash is available on all three OSes; on Windows pwsh may not resolve
      # the extensionless ./gradlew script
      shell: bash
      env:
        SCCACHE_GHA_ENABLED: "true"
        RUSTC_WRAPPER: "sccache"
        # Make cargo fail fast on lockfile mismatch instead of hanging on a
        # crates.io index update when the network is flaky.
        CARGO_NET_RETRY: "5"
        CARGO_INCREMENTAL: "0"
      run: ./gradlew assembleDist installDist

    - name: Create Windows Installer
      if: runner.os == 'Windows' && github.ref_type == 'tag'
      working-directory: installer
      shell: pwsh
      run: iscc installer.iss /DAppVersion=$($env:GITHUB_REF_NAME.Substring(1))

    - name: Upload Release Artifact
      if: github.ref_type == 'tag'
      shell: bash
      run: |
        os=$(echo $RUNNER_OS | tr '[:upper:]' '[:lower:]')

        case $os in
          windows)
            mv build/distributions/lcqt2.zip windows-portable.zip
            artifacts="windows-portable.zip installer/*.exe";;
          *)
            mv build/distributions/lcqt2.tar.gz $os-portable.tar.gz
            artifacts="$os-portable.tar.gz";;
        esac

        gh release upload ${{ github.ref_name }} $artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
